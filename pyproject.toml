[project]
name = "apple-health-export"
version = "0.1.0"
description = "Extract and convert subsets of Apple Health export.xml into analysis-friendly formats"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Nobuhiro Shito", email = "andantino190@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2.0",
    "pyyaml>=6.0",
    "openpyxl>=3.1.0",
    "pyarrow>=15.0.0",
]

[project.scripts]
health-export = "apple_health_export.cli:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v"
